[package]
name = "teams-core"
description = "Headless Teams client state machine, exposed to the macOS app through UniFFI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
teams-i18n.workspace = true
serde.workspace = true
teams-calendar.workspace = true
teams-files.workspace = true
teams-auth.workspace = true
teams-chat.workspace = true
teams-calling.workspace = true
teams-realtime.workspace = true
http.workspace = true
url.workspace = true
percent-encoding.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time", "sync", "net", "io-util", "fs"] }
axum = { workspace = true, features = ["query"], optional = true }
chrono.workspace = true
scraper = "0.24"
linkify = "0.10"
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
uniffi = { version = "0.32.2", features = ["cli"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[features]
# In-process fake Microsoft services behind `--demo`. Never in a release build.
demo = ["dep:axum", "teams-calling/fake", "teams-realtime/fake"]

[dev-dependencies]
teams-core = { path = ".", features = ["demo"] }
