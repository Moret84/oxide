<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Oxide app icon: a team in a chat bubble. Render with scripts/make-icon.sh. -->
  <defs>
    <linearGradient id="body" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECECF4"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="236" x2="0" y2="836" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7B7FE0"/>
      <stop offset="1" stop-color="#4B4FB8"/>
    </linearGradient>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="bubbleShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#4B4FB8" flood-opacity="0.30"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)" filter="url(#iconShadow)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#000000" stroke-opacity="0.06"/>
  <g filter="url(#bubbleShadow)" fill="url(#violet)">
    <rect x="190" y="236" width="644" height="464" rx="132"/>
    <path d="M300,640 L300,700 C300,764 276,806 236,836 C326,834 406,794 452,700 L452,640 Z"/>
  </g>
  <g fill="#FFFFFF" fill-opacity="0.72">
    <circle cx="428" cy="380" r="60"/>
    <path d="M298,604 C298,522 356,470 428,470 C500,470 558,522 558,604 Z"/>
  </g>
  <g fill="#FFFFFF" stroke="url(#violet)" stroke-width="20" paint-order="stroke">
    <circle cx="592" cy="408" r="66"/>
    <path d="M448,644 C448,556 512,504 592,504 C672,504 736,556 736,644 Z"/>
  </g>
</svg>
